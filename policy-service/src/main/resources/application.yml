server:
  port: 8083

spring:
  application:
    name: policy-service
  datasource:
    url: jdbc:mysql://localhost:3306/policy_db
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret: change-this-to-a-long-random-secret-key-at-least-32-chars
