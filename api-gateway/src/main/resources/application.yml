server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**, /api/users/**, /api/admin/**
            - id: policy-service
              uri: lb://POLICY-SERVICE
              predicates:
                - Path=/api/policies/**
            - id: customer-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/api/customers/**, /api/nominee-requests/**, /api/bank-accounts/**
            - id: claims-service
              uri: lb://CLAIMS-SERVICE
              predicates:
                - Path=/api/claims/**
            - id: loan-service
              uri: lb://LOAN-SERVICE
              predicates:
                - Path=/api/loans/**
            - id: grievance-service
              uri: lb://GRIEVANCE-SERVICE
              predicates:
                - Path=/api/grievances/**

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret: change-this-to-a-long-random-secret-key-at-least-32-chars

